name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: dotnet test --configuration Release --nologo

  pack:
    needs: test
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    # OIDC subject: repo:…:environment:production (covers main + tag/release packs)
    environment: production
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $v = "${{ github.event.release.tag_name }}".TrimStart("v")
          } else {
            $v = (Select-Xml -Path src/S2F.RaceDayCheckout/S2F.RaceDayCheckout.csproj -XPath "//Version").Node.InnerText
            $v = "$v-ci.${{ github.run_number }}"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Pack version: $v"

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/S2F.RaceDayCheckout/S2F.RaceDayCheckout.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          /p:PublishSingleFile=true
          /p:Version=${{ steps.ver.outputs.version }}
          /p:InformationalVersion=${{ steps.ver.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Bundle Notepad++ installer
        shell: pwsh
        run: ./build/fetch-notepadpp.ps1 -Rid "${{ matrix.rid }}" -Destination "publish/${{ matrix.rid }}/redist"

      # Optional: MSI via URL secret (too large for Actions' 64KB secret limit) + deploy.json secret.
      # Skips cleanly when unset — Setup still packs.
      - name: Bundle RemotePC deploy (optional)
        shell: pwsh
        env:
          REMOTEPC_HOST_BIN_URL: ${{ secrets.REMOTEPC_HOST_BIN_URL }}
          REMOTEPC_DEPLOY_JSON_B64: ${{ secrets.REMOTEPC_DEPLOY_JSON_B64 }}
          REMOTEPC_DEPLOY_JSON: ${{ secrets.REMOTEPC_DEPLOY_JSON }}
        run: ./build/copy-remotepc-redist.ps1 -Destination "publish/${{ matrix.rid }}/redist"

      - name: Check Artifact Signing config
        id: signing
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ready = -not [string]::IsNullOrWhiteSpace($env:ENDPOINT) `
            -and -not [string]::IsNullOrWhiteSpace($env:ACCOUNT) `
            -and -not [string]::IsNullOrWhiteSpace($env:PROFILE) `
            -and -not [string]::IsNullOrWhiteSpace($env:CLIENT_ID) `
            -and -not [string]::IsNullOrWhiteSpace($env:TENANT_ID) `
            -and -not [string]::IsNullOrWhiteSpace($env:SUBSCRIPTION_ID)
          if ($ready) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Azure Artifact Signing configured."
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Azure Artifact Signing vars/secrets incomplete — packing unsigned (SmartScreen may warn)."
          }

      - name: Azure login (OIDC)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write Artifact Signing metadata
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          $meta = @{
            Endpoint = $env:ENDPOINT.TrimEnd('/')
            CodeSigningAccountName = $env:ACCOUNT
            CertificateProfileName = $env:PROFILE
          } | ConvertTo-Json
          $path = Join-Path $env:GITHUB_WORKSPACE "trusted-signing.json"
          Set-Content -Path $path -Value $meta -Encoding utf8
          Write-Host "Wrote $path"
          Write-Host $meta

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Velopack pack ${{ matrix.rid }}
        shell: pwsh
        run: |
          $channel = "${{ matrix.rid }}"
          $version = "${{ steps.ver.outputs.version }}"
          # Start menu only — Desktop is OneDrive-backed on race laptops; Velopack/OneDrive
          # rewriting the .lnk resets icon position (looks like the shortcut is "stuck").
          $args = @(
            "pack",
            "--packId", "S2F.RaceDayCheckout",
            "--packVersion", $version,
            "--packDir", "publish/$channel",
            "--mainExe", "S2F.RaceDayCheckout.exe",
            "--packTitle", "S2F Race Day Timing",
            "--icon", "src/S2F.RaceDayCheckout/Assets/app.ico",
            "--shortcuts", "StartMenuRoot",
            "--aumid", "Start2Finish.RaceDayCheckout",
            "--channel", $channel,
            "--outputDir", "releases/$channel"
          )
          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            $meta = Join-Path $env:GITHUB_WORKSPACE "trusted-signing.json"
            $args += @("--azureTrustedSignFile", $meta)
            Write-Host "Packing with Azure Artifact Signing…"
          } else {
            Write-Host "Packing without code signing…"
          }
          & vpk @args
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed with exit $LASTEXITCODE" }

      - name: Upload pack artifact
        uses: actions/upload-artifact@v5
        with:
          name: velopack-${{ matrix.rid }}
          path: releases/${{ matrix.rid }}/

  publish-release:
    needs: pack
    if: github.event_name == 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download x64
        uses: actions/download-artifact@v5
        with:
          name: velopack-win-x64
          path: releases/win-x64
      - name: Download arm64
        uses: actions/download-artifact@v5
        with:
          name: velopack-win-arm64
          path: releases/win-arm64

      # GPL-3: convey Notepad++ corresponding source from the same release as the installer.
      - name: Download Notepad++ source
        shell: pwsh
        run: ./build/fetch-notepadpp.ps1 -SourceZip "npp-gpl-source.zip"

      # Release already exists (created by `gh release create` / UI). Attach assets; don't create again.
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            (Get-ChildItem -Path releases/win-x64,releases/win-arm64 -File).FullName `
            "npp-gpl-source.zip" `
            --repo "${{ github.repository }}" `
            --clobber
